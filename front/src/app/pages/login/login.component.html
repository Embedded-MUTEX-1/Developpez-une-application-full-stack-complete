<app-header></app-header>
<div class="vh-100">
    <a routerLink="/" class="align-self-center"><img src="assets/arrow.png" alt="Back button" class="mt-2 ms-3"></a>

    <div class="row justify-content-center mt-5 mx-0 d-sm-none">
      <img src="assets/logo_p6.png" alt="Logo MDD" class="w-50">
    </div>

    <p class="text-center">Se connecter</p>

    <form #loginForm="ngForm" (ngSubmit)="submitForm()" class="d-flex flex-column gap-4">
        <div class="form-group m-auto">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="loginData.email" required>
            <div *ngIf="loginForm.touched && loginForm.invalid" class="text-danger">
                Champ invalide.
            </div>
        </div>

        <div class="form-group m-auto">
            <label for="password">Mot de passe</label>
            <input type="password" class="form-control" id="password" name="password" [(ngModel)]="loginData.password" minlength="5" required>
            <div *ngIf="loginForm.touched && loginForm.invalid" class="text-danger">
                Champ invalide.
            </div>
        </div>

        <button type="submit" class="btn align-self-center">Submit</button>
    </form>
</div>
